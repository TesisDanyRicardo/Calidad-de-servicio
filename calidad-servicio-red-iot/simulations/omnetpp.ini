[General]
network = IoTNetwork
sim-time-limit = 40s
warmup-period = 12s
ned-path = .;../src;../../inet4.5/src
repeat = 10

# --- Registro de resultados ---
**.vector-recording = false
**.scalar-recording = true
**.app[*].endToEndDelay.result-recording-modes = default,stats

# --- Area de despliegue (100 x 100 m) ---
**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxX = 100m
**.constraintAreaMaxY = 100m
**.constraintAreaMaxZ = 0m

# --- Movilidad: posiciones fijas, sin sincronizar con displayString ---
**.mobility.typename = "StationaryMobility"
**.mobility.initFromDisplayString = false
**.mobility.updateFromDisplayString = false
**.mmtc[*].mobility.initialX = uniform(0m, 100m)
**.mmtc[*].mobility.initialY = uniform(0m, 100m)
**.mmtc[*].mobility.initialZ = 0m
**.urllc[*].mobility.initialX = uniform(0m, 100m)
**.urllc[*].mobility.initialY = uniform(0m, 100m)
**.urllc[*].mobility.initialZ = 0m
**.sensor[*].mobility.initialX = uniform(0m, 100m)
**.sensor[*].mobility.initialY = uniform(0m, 100m)
**.sensor[*].mobility.initialZ = 0m
**.gateway.mobility.initialX = 50m
**.gateway.mobility.initialY = 50m
**.gateway.mobility.initialZ = 0m
**.server.mobility.initialX = 90m
**.server.mobility.initialY = 50m
**.server.mobility.initialZ = 0m
**.agregado.mobility.initialX = 10m
**.agregado.mobility.initialY = 90m
**.agregado.mobility.initialZ = 0m

# --- Interfaces del gateway: 2 Wi-Fi + 1 de 802.15.4 ---
*.gateway.numWlanInterfaces = 3
*.gateway.wlan[0].typename = "Ieee80211Interface"
*.gateway.wlan[1].typename = "Ieee80211Interface"
*.gateway.wlan[2].typename = "Ieee802154NarrowbandInterface"
*.gateway.wlan[0..1].mgmt.typename = "Ieee80211MgmtAdhoc"
*.gateway.wlan[0..1].agent.typename = ""

# --- Wi-Fi: 802.11g, 100 mW, canales ortogonales (1 y 6) ---
*.mmtc[*].wlan[*].opMode = "g(erp)"
*.urllc[*].wlan[*].opMode = "g(erp)"
*.gateway.wlan[0..1].opMode = "g(erp)"
*.mmtc[*].wlan[*].radio.transmitter.power = 100mW
*.urllc[*].wlan[*].radio.transmitter.power = 100mW
*.gateway.wlan[0..1].radio.transmitter.power = 100mW

*.mmtc[*].wlan[0].radio.channelNumber = 0
*.gateway.wlan[0].radio.channelNumber = 0
*.urllc[*].wlan[0].radio.channelNumber = 5
*.gateway.wlan[1].radio.channelNumber = 5

*.mmtc[*].wlan[*].radio.radioMediumModule = "radioMedium"
*.urllc[*].wlan[*].radio.radioMediumModule = "radioMedium"
*.gateway.wlan[0..1].radio.radioMediumModule = "radioMedium"

# --- Sensores 802.15.4: 1 mW, medio de radio propio ---
*.sensor[*].wlan[0].radio.transmitter.power = 1mW
*.gateway.wlan[2].radio.transmitter.power = 1mW
*.sensor[*].wlan[0].radio.radioMediumModule = "sensorMedium"
*.gateway.wlan[2].radio.radioMediumModule = "sensorMedium"

# --- Propagacion en espacio libre ---
*.radioMedium.pathLoss.typename = "FreeSpacePathLoss"
*.sensorMedium.pathLoss.typename = "FreeSpacePathLoss"

# --- Enrutamiento ---
*.configurator.addStaticRoutes = true
*.configurator.addDefaultRoutes = true
*.configurator.addSubnetRoutes = true

# ============================================================
# TRAFICO - 4 clases diferenciadas
# ============================================================

# --- mMTC: 120 nodos, 8 paq/s, 200 B, puerto 5000 ---
# proceso de Poisson: intervalo exponencial de media 125 ms
*.mmtc[*].numApps = 1
*.mmtc[*].app[0].typename = "UdpBasicApp"
*.mmtc[*].app[0].destAddresses = "server"
*.mmtc[*].app[0].destPort = 5000
*.mmtc[*].app[0].messageLength = 200B
*.mmtc[*].app[0].sendInterval = exponential(125ms)
*.mmtc[*].app[0].startTime = uniform(0s, 1s)

# --- URLLC: 20 nodos, 50 paq/s (20 ms), 32 B, puerto 5001 ---
# bucle de control periodico (3GPP TR 38.913, paquete de referencia)
*.urllc[*].numApps = 1
*.urllc[*].app[0].typename = "UdpBasicApp"
*.urllc[*].app[0].destAddresses = "server"
*.urllc[*].app[0].destPort = 5001
*.urllc[*].app[0].messageLength = 32B
*.urllc[*].app[0].sendInterval = 20ms
*.urllc[*].app[0].startTime = uniform(0s, 20ms)

# --- Sensores IoT: 40 nodos, 0.1 paq/s (10 s), 20 B, puerto 5002 ---
# 802.15.4: 20 B de carga util en trama de 45 B (127 B max - 25 B overhead)
*.sensor[*].numApps = 1
*.sensor[*].app[0].typename = "UdpBasicApp"
*.sensor[*].app[0].destAddresses = "server"
*.sensor[*].app[0].destPort = 5002
*.sensor[*].app[0].messageLength = 20B
*.sensor[*].app[0].sendInterval = exponential(10s)
*.sensor[*].app[0].startTime = uniform(0s, 10s)

# --- Agregado: 1 nodo, 20 flujos x 5 paq/s = 100 paq/s ---
*.agregado.numApps = 1
*.agregado.app[0].typename = "UdpBasicApp"
*.agregado.app[0].destAddresses = "server"
*.agregado.app[0].destPort = 5003
*.agregado.app[0].messageLength = 512B
*.agregado.app[0].sendInterval = exponential(10ms)
*.agregado.app[0].startTime = 0s

# --- Servidor: un sumidero por clase de trafico ---
*.server.numApps = 4
*.server.app[0].typename = "UdpSink"
*.server.app[0].localPort = 5000
*.server.app[1].typename = "UdpSink"
*.server.app[1].localPort = 5001
*.server.app[2].typename = "UdpSink"
*.server.app[2].localPort = 5002
*.server.app[3].typename = "UdpSink"
*.server.app[3].localPort = 5003

# ============================================================
# E-BASE: escenario base (FIFO, sin marcar)
# ============================================================

[Config Etapa1_Base]
description = "E-BASE: FIFO unica, sin marcacion DSCP"
**.gateway.ppp[0].queue.typename = "DropTailQueue"
**.gateway.ppp[0].queue.packetCapacity = 100

# ============================================================
# E-QOS: DiffServ 1P4Q con marcado diferenciado
# ============================================================

[Config Etapa2_DiffServ]
description = "E-QOS: DiffServ con marcado diferenciado por clase"

**.gateway.ppp[0].queue.typename = "DiffservIoT"
**.gateway.ppp[0].queue.interfaceTableModule = "IoTNetwork.gateway.interfaceTable"
**.gateway.ppp[0].queue.packetCapacity = -1
**.gateway.ppp[0].queue.efQueue.packetCapacity = 5
**.gateway.ppp[0].queue.*.packetCapacity = 100
**.gateway.ppp[0].queue.efMeter.cir = "30%"
**.gateway.ppp[0].queue.efMeter.cbs = 5000B
**.gateway.ppp[0].queue.wrr.weights = "16 1 1 1"

# Marcado DSCP por clase
# URLLC    -> EF   (46)
# mMTC     -> AF21 (18)
# Sensores -> AF11 (10)
# Agregado -> CS1  (8)
*.urllc[*].app[0].dscp = 46      # EF   - control de baja latencia
*.mmtc[*].app[0].dscp = 18       # AF21 - datos de alta prioridad
*.sensor[*].app[0].dscp = 10     # AF11 - datos de prioridad media
*.agregado.app[0].dscp = 8       # CS1  - datos de baja prioridad
# ============================================================
# E-VIG: mismas colas, pesos y medidor que E-QOS, con el marcado
# DSCP de mMTC y URLLC intercambiado.
# ============================================================

[Config Etapa3_Invertido]
description = "Control: EF asignado a mMTC en lugar de a URLLC"

**.gateway.ppp[0].queue.typename = "DiffservIoT"
**.gateway.ppp[0].queue.interfaceTableModule = "IoTNetwork.gateway.interfaceTable"
**.gateway.ppp[0].queue.packetCapacity = -1
**.gateway.ppp[0].queue.efQueue.packetCapacity = 5
**.gateway.ppp[0].queue.*.packetCapacity = 100
**.gateway.ppp[0].queue.efMeter.cir = "30%"
**.gateway.ppp[0].queue.efMeter.cbs = 5000B
**.gateway.ppp[0].queue.wrr.weights = "16 1 1 1"

# Marcado INTERCAMBIADO respecto a Etapa2_DiffServ:
*.mmtc[*].app[0].dscp = 46       # EF   (invertido)
*.urllc[*].app[0].dscp = 18      # AF21 (invertido)
*.sensor[*].app[0].dscp = 10     # AF11
*.agregado.app[0].dscp = 8       # CS1

# E-INV: marcado intercambiado, pesos iguales y CIR del 95 %
[Config Etapa4_InvertidoSinVigilancia]
description = "Control limpio: EF a mMTC sin recorte del medidor"

**.gateway.ppp[0].queue.typename = "DiffservIoT"
**.gateway.ppp[0].queue.interfaceTableModule = "IoTNetwork.gateway.interfaceTable"
**.gateway.ppp[0].queue.packetCapacity = -1
**.gateway.ppp[0].queue.efQueue.packetCapacity = 5
**.gateway.ppp[0].queue.*.packetCapacity = 100
**.gateway.ppp[0].queue.efMeter.cir = "95%"
**.gateway.ppp[0].queue.efMeter.cbs = 5000B
**.gateway.ppp[0].queue.wrr.weights = "1 1 1 1"

*.mmtc[*].app[0].dscp = 46       # EF   (invertido)
*.urllc[*].app[0].dscp = 18      # AF21 (invertido)
*.sensor[*].app[0].dscp = 10     # AF11
*.agregado.app[0].dscp = 8       # CS1



# ============================================================
# E-DIN: incorporacion progresiva de clases
# El trafico agregado actua como carga de fondo permanente
# (~15% del troncal). Las otras tres clases se activan por fases.
#
#   0-15 s   solo fondo
#  15-45 s   fondo + URLLC
#  45-75 s   fondo + URLLC + mMTC
#  75-90 s   las cuatro clases
#  90-100 s  solo fondo        (vaciado de colas)
# ============================================================

[Config Dinamico_Base]
description = "Dinamico: FIFO unica, incorporacion progresiva"
sim-time-limit = 100s
warmup-period = 0s
repeat = 1

# --- Vectores activados: son la base de las graficas temporales ---
**.server.app[*].endToEndDelay:vector.vector-recording = true
**.gateway.ppp[0].queue.queueLength:vector.vector-recording = true
**.server.app[*].packetReceived:vector(packetBytes).vector-recording = true

# --- Fondo permanente al 15% del troncal (70 paq/s x 540 B) ---
*.agregado.app[0].sendInterval = exponential(14.3ms)
*.agregado.app[0].startTime = 0s
*.agregado.app[0].stopTime = 100s

# --- URLLC: ventana 15-90 s, arranque escalonado sobre 20 ms ---
*.urllc[*].app[0].startTime = 15s + uniform(0s, 20ms)
*.urllc[*].app[0].stopTime = 90s

# --- mMTC: ventana 45-90 s, arranque escalonado sobre 1 s ---
*.mmtc[*].app[0].startTime = 45s + uniform(0s, 1s)
*.mmtc[*].app[0].stopTime = 90s

# --- Sensores: ventana 75-90 s, arranque escalonado sobre 2 s ---
*.sensor[*].app[0].startTime = 75s + uniform(0s, 2s)
*.sensor[*].app[0].stopTime = 90s

**.gateway.ppp[0].queue.typename = "DropTailQueue"
**.gateway.ppp[0].queue.packetCapacity = 100


[Config Dinamico_DiffServ]
extends = Dinamico_Base
description = "Dinamico: DiffServ, incorporacion progresiva"

**.gateway.ppp[0].queue.typename = "DiffservIoT"
**.gateway.ppp[0].queue.interfaceTableModule = "IoTNetwork.gateway.interfaceTable"
**.gateway.ppp[0].queue.packetCapacity = -1
**.gateway.ppp[0].queue.efQueue.packetCapacity = 5
**.gateway.ppp[0].queue.*.packetCapacity = 100
**.gateway.ppp[0].queue.efMeter.cir = "30%"
**.gateway.ppp[0].queue.efMeter.cbs = 5000B
**.gateway.ppp[0].queue.wrr.weights = "16 1 1 1"

**.gateway.ppp[0].queue.*.queueLength:vector.vector-recording = true

*.urllc[*].app[0].dscp = 46
*.mmtc[*].app[0].dscp = 18
*.sensor[*].app[0].dscp = 10
*.agregado.app[0].dscp = 8



[Config Prueba_Arp]
extends = Dinamico_Base
description = "Diagnostico: sin GlobalArp, 30s"
sim-time-limit = 30s

**.arp.typename = "Arp"

*.urllc[*].app[0].startTime = 5s + uniform(0s, 20ms)
*.urllc[*].app[0].stopTime = 30s
*.mmtc[*].app[0].startTime = 10s + uniform(0s, 1s)
*.mmtc[*].app[0].stopTime = 30s
*.sensor[*].app[0].startTime = 15s
*.sensor[*].app[0].stopTime = 30s
